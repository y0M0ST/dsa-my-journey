name: 🧪 CI — Vitest Test Suite

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# Cancel redundant runs triggered by the same PR branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Vitest on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ────────────────────────────────────────────────────
      - name: ⚙️  Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: 📦 Install dependencies
        run: npm ci

      # ── 4. Type-check (optional but highly recommended) ─────────────────────
      - name: 🔍 TypeScript type-check
        run: npx tsc --noEmit

      # ── 5. Run Vitest ────────────────────────────────────────────────────────
      - name: 🧪 Run Vitest test suite
        run: npm run test

      # ── 6. Upload test results as artifact on failure ─────────────────────────
      - name: 📊 Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            coverage/
            *.log
          retention-days: 7
